<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#8b5cf6">
<title>Litery</title>
<style>
  :root{
    --main:#8b5cf6; --main-dark:#6d3fd6; --main-soft:#8b5cf638; --on-main:#fff;
    --bg:#e6d9fb; --bg2:#cdb4f5; --ink:#241634; --dim:#6b5a80;
    --card:#ffffff; --line:#c2a9e8;
    --good:#22c55e; --good-dark:#15803d; --dead:#c2b6cf;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  /* the canvas under the app gets the gradient's end colour, so nothing white
     can ever show through, and body is pinned to the viewport with inset:0    */
  html{height:100%;background:var(--bg2);}
  html.dark{background:#14161c;}
  html,body{margin:0;overflow:hidden;}
  body{position:fixed;inset:0;
       background:linear-gradient(168deg,var(--bg) 0%,var(--bg2) 100%);color:var(--ink);
       font:700 18px/1.4 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;
       display:flex;flex-direction:column;}

  .screen{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;
          padding:calc(20px + env(safe-area-inset-top,0px)) 20px 20px;text-align:center;}
  .screen.on{display:flex;}

  /* ---------- profile ---------- */
  .hi{font-size:26px;color:var(--dim);margin-bottom:10px;}
  .avatar{width:min(48vw,200px);height:min(48vw,200px);border-radius:50%;background:var(--main);
          display:flex;align-items:center;justify-content:center;font-size:min(27vw,112px);
          border:0;padding:0;box-shadow:0 12px 0 var(--main-dark),0 22px 40px rgba(40,10,80,.22);}
  .avatar:active{transform:translateY(7px);box-shadow:0 5px 0 var(--main-dark);}
  .pname{font-size:44px;font-weight:800;margin-top:26px;}
  .nameinput{font:800 34px/1 ui-rounded,system-ui,sans-serif;text-align:center;
             border:0;border-radius:20px;padding:16px 20px;width:min(76vw,360px);
             background:var(--card);color:var(--ink);box-shadow:0 6px 0 var(--line);
             margin-bottom:22px;}
  .setuphint{font-size:14px;color:var(--dim);margin-top:18px;max-width:320px;}
  .synckeyin{font-size:15px !important;width:100% !important;padding:12px 14px !important;
             margin-bottom:0 !important;box-shadow:none !important;
             background:#0b0d12 !important;color:#cfd5e1 !important;
             font-family:ui-monospace,monospace !important;}

  /* ---------- welcome ---------- */
  .wav{width:min(46vw,200px);height:min(46vw,200px);border-radius:50%;background:var(--main);
       display:flex;align-items:center;justify-content:center;font-size:min(26vw,112px);
       box-shadow:0 12px 0 var(--main-dark),0 22px 40px rgba(40,10,80,.22);}
  .wtitle{font-size:clamp(32px,6.5vh,50px);font-weight:800;margin-top:28px;}

  /* ---------- language ---------- */
  .flags{display:flex;gap:34px;flex-wrap:wrap;justify-content:center;}
  .flag{width:200px;height:162px;border-radius:34px;background:var(--card);
        border:0;font-size:88px;display:flex;align-items:center;justify-content:center;
        padding:0;box-shadow:0 9px 0 var(--line),0 18px 34px rgba(40,10,80,.16);}
  .flag:active{transform:translateY(6px);box-shadow:0 3px 0 var(--line);}

  /* ---------- play ---------- */
  #play{justify-content:flex-start;padding:0;}
  .top{width:100%;display:flex;align-items:center;gap:8px;
       padding:calc(14px + env(safe-area-inset-top,0px)) 62px 2px 14px;}
  .top > *{flex:none;}
  .top .stars{flex:1 1 0;}   /* basis 0: take only what the controls leave */
  .stars{flex:1;display:flex;gap:4px;align-items:center;}
  .stars{min-width:0;}
  .st{flex:1 1 0;min-width:4px;max-width:18px;aspect-ratio:1;border-radius:50%;
      background:rgba(255,255,255,.5);box-shadow:inset 0 0 0 2px var(--line);}
  .st.f{background:var(--main);box-shadow:none;}
  .goalpin{font-size:19px;margin-left:5px;opacity:.85;}
  .trophy{background:transparent;border:0;padding:0 4px;min-width:0;
          font:800 20px/1 ui-rounded,system-ui,sans-serif;color:var(--ink);
          display:flex;align-items:center;gap:5px;flex:none;margin:0;}
  /* one control, reachable from every screen. long press keeps her out. */
  .gear{position:fixed;z-index:28;
        top:calc(8px + env(safe-area-inset-top,0px));right:10px;
        width:46px;height:46px;border-radius:50%;background:transparent;border:0;
        font-size:20px;color:var(--dim);opacity:.42;padding:0;margin:0;}
  .gear:active{opacity:1;transform:scale(.92);}
  /* the back arrow used to borrow .gear and went fixed with it, landing on
     top of the settings icon. it belongs in the bar.                     */
  .navb{width:40px;height:40px;border-radius:50%;background:transparent;border:0;
        font:600 20px/1 ui-rounded,system-ui,sans-serif;color:var(--dim);
        opacity:.55;padding:0;margin:0;}
  .navb:active{opacity:1;transform:scale(.92);}

  .stage{flex:1;display:flex;flex-direction:column;align-items:center;
         justify-content:space-evenly;width:100%;padding:2px 14px 18px;}
  .pic{font-size:clamp(104px,21vh,180px);line-height:1;border:0;margin:0;
       background:rgba(255,255,255,.66);border-radius:40px;padding:12px 34px;
       box-shadow:0 10px 28px rgba(40,10,80,.13);}
  .pic:active{transform:scale(.96);}
  .picwrap{display:flex;flex-direction:column;align-items:center;gap:12px;}
  .hint{font-size:16px;color:var(--dim);height:20px;font-weight:600;}
  .pic.counting{padding:16px 20px;}
  /* fixed dice arrangements. objects that flow into whatever fits the width
     have to be counted one by one every time; a shape stays the same and can
     eventually be recognised without counting at all.                     */
  .cnt{display:grid;gap:4px;place-items:center;
       grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
       width:min(52vw,300px);height:min(52vw,300px);}
  .cnt.wide{grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);
            width:min(62vw,400px);height:min(26vw,170px);}
  .cnt span{font-size:clamp(34px,6.6vh,58px);line-height:1;}
  .cnt.wide span{font-size:clamp(26px,5vh,44px);}
  .band{display:none;position:fixed;top:0;left:0;right:0;z-index:30;
        background:#7a2e39;color:#fff;font-size:12px;font-weight:700;
        letter-spacing:.06em;text-align:center;
        padding:calc(3px + env(safe-area-inset-top,0px)) 8px 3px;}
  .build{position:fixed;bottom:7px;right:12px;font-size:11px;color:var(--dim);
         opacity:.4;font-weight:600;z-index:20;}

  /* one tile per letter, so a word is visibly made of parts */
  .word{display:flex;gap:9px;justify-content:center;}
  .cell{width:clamp(58px,10vh,88px);height:clamp(70px,12.4vh,104px);border-radius:20px;
        background:var(--card);color:var(--ink);display:flex;align-items:center;
        justify-content:center;font-size:clamp(38px,7vh,60px);font-weight:800;
        box-shadow:0 5px 0 rgba(70,30,120,.13);}
  .cell.tappable{cursor:pointer;}
  .cell.tappable:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(70,30,120,.13);}
  .cell.gap{background:rgba(255,255,255,.32);box-shadow:inset 0 0 0 4px var(--main);}
  .cell.gap.in{background:var(--good);color:#fff;box-shadow:0 5px 0 var(--good-dark);}

  .opts{display:flex;gap:26px;justify-content:center;}
  .opt{width:clamp(110px,16.5vh,142px);height:clamp(110px,16.5vh,142px);border-radius:30px;
       background:var(--main);color:var(--on-main);font-size:clamp(46px,7.8vh,62px);
       font-weight:800;border:0;padding:0;box-shadow:0 8px 0 var(--main-dark);}
  .opt:active{transform:translateY(6px);box-shadow:0 2px 0 var(--main-dark);}
  .opt.good{background:var(--good);box-shadow:0 8px 0 var(--good-dark);}
  .opt.dead{background:var(--dead);box-shadow:0 8px 0 rgba(0,0,0,.10);opacity:.55;}
  .shake{animation:sh .4s;}
  @keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-11px)}
                40%{transform:translateX(11px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
  .pop{animation:pp .45s;}
  @keyframes pp{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.18)}100%{transform:scale(1)}}

  /* ---------- prize board ---------- */
  .btitle{font-size:clamp(26px,5.2vh,40px);font-weight:800;margin-bottom:20px;}
  .grid{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;
        max-width:640px;margin-bottom:26px;}
  .grid span{font-size:clamp(40px,7.5vh,58px);line-height:1;
             background:var(--card);border-radius:20px;padding:8px 10px;
             box-shadow:0 5px 0 rgba(70,30,120,.12);}
  .grid .slot{width:clamp(56px,9.4vh,78px);height:clamp(56px,9.4vh,78px);
              border-radius:20px;background:rgba(255,255,255,.34);
              box-shadow:inset 0 0 0 4px var(--line);}
  .bnone{font-size:19px;color:var(--dim);margin-bottom:26px;}
  .backx{position:fixed;left:16px;top:calc(14px + env(safe-area-inset-top,0px));
         width:60px;height:60px;border-radius:50%;background:var(--main);
         color:var(--on-main);border:0;padding:0;z-index:9;
         font:800 32px/1 ui-rounded,system-ui,sans-serif;
         box-shadow:0 6px 0 var(--main-dark);}
  .backx:active{transform:translateY(5px);box-shadow:0 2px 0 var(--main-dark);}
  .bhint{font-size:15px;color:var(--dim);margin-top:6px;font-weight:600;}
  .bigprize{display:none;position:fixed;left:0;right:0;top:-140px;bottom:-140px;
            z-index:40;align-items:center;
            justify-content:center;background:rgba(20,8,40,.78);
            -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
  .bigprize.on{display:flex;}
  .bigprize span{font-size:min(56vw,340px);line-height:1;
                 animation:pp .45s, bob 2.6s ease-in-out .45s infinite;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}
                 50%{transform:translateY(-22px) rotate(3deg)}}

  .confetti{position:fixed;left:0;right:0;top:-60px;bottom:-60px;
            pointer-events:none;z-index:45;overflow:hidden;display:none;}
  .confetti.on{display:block;}
  .confetti i{position:absolute;top:-10%;font-style:normal;font-size:24px;
              animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(125vh) rotate(720deg);opacity:.2;}}

  .grid span.fresh{animation:pp .5s, glow 1.6s ease-in-out 3;}
  @keyframes glow{0%,100%{box-shadow:0 5px 0 rgba(70,30,120,.12);}
                  50%{box-shadow:0 0 0 6px var(--main-soft),0 5px 0 rgba(70,30,120,.12);}}
  .albumbar{width:min(78vw,420px);height:12px;border-radius:7px;background:rgba(255,255,255,.4);
            overflow:hidden;margin:-8px 0 20px;}
  .albumbar i{display:block;height:100%;border-radius:7px;background:var(--main);
              transition:width .6s ease;}

  /* ---------- reward ---------- */
  .big{font-size:clamp(96px,19vh,150px);line-height:1;}
  .rtitle{font-size:clamp(30px,5.6vh,42px);font-weight:800;margin:16px 0 4px;}
  .rsub{font-size:20px;color:var(--dim);margin-bottom:22px;}
  .book{display:flex;flex-wrap:wrap;gap:11px;justify-content:center;max-width:540px;margin-bottom:26px;}
  .book span{font-size:38px;background:var(--card);border-radius:16px;padding:6px 8px;
             box-shadow:0 4px 0 rgba(70,30,120,.12);}
  .rbtns{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
  .go{background:var(--main);color:var(--on-main);border:0;border-radius:22px;
      padding:18px 32px;font-size:22px;font-weight:800;box-shadow:0 7px 0 var(--main-dark);}
  .go:active{transform:translateY(5px);box-shadow:0 2px 0 var(--main-dark);}
  .go.ghost{background:var(--card);color:var(--ink);box-shadow:0 7px 0 var(--line);
            min-width:92px;font-size:30px;padding:14px 24px;}
  .go.ghost:active{box-shadow:0 2px 0 var(--line);}

  /* ---------- parent ---------- */
  /* pinned to the viewport rather than relying on being a flex child that
     fills it — the same fix that killed the white strip on the game screen */
  #stats,#parent{justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  #stats.on,#parent.on{position:fixed;inset:0;z-index:25;background:#14161c;}
  #stats{background:#14161c;color:#eceff5;}
  #stats h3{margin:4px 0 12px;font-size:19px;font-weight:800;}
  .sbody{width:100%;max-width:560px;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
         text-align:left;font-size:14px;padding-right:4px;}
  .shead{color:#9aa3b2;font-size:12px;letter-spacing:.09em;text-transform:uppercase;
         font-weight:700;margin:16px 0 7px;}
  .srow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding-top:10px;}
  .item{display:flex;align-items:center;gap:9px;padding:5px 0;border-bottom:1px solid #262b38;}
  .item .g{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;
           justify-content:center;font-weight:800;font-size:17px;color:#0d0f14;flex:none;}
  .item .bar{flex:1;height:7px;border-radius:4px;background:#262b38;overflow:hidden;}
  .item .bar i{display:block;height:100%;border-radius:4px;}
  .item .nums{width:112px;text-align:right;color:#9aa3b2;font-size:12px;flex:none;}
  .dtab{width:100%;border-collapse:collapse;font-size:13px;}
  .dtab td{padding:5px 6px;border-bottom:1px solid #262b38;}
  .dtab td.r{text-align:right;color:#9aa3b2;}
  .empty{color:#9aa3b2;padding:8px 0;}
  .dump{display:none;width:100%;max-width:560px;height:120px;margin-top:8px;font-size:11px;
        background:#0b0d12;color:#7f8899;border:1px solid #262b38;border-radius:8px;}
  #parent{background:#14161c;color:#eceff5;}
  #parent h3{margin:0 0 18px;font-size:19px;font-weight:800;}
  .prow{width:100%;max-width:420px;text-align:left;margin-bottom:20px;}
  .prow label{display:block;font-size:14px;color:#9aa3b2;margin-bottom:7px;font-weight:600;}
  .prow input[type=range]{width:100%;accent-color:#7c5cff;height:32px;}
  .pbtn{background:#39415a;color:#fff;border:0;border-radius:12px;padding:14px 20px;
        font-size:16px;font-weight:700;margin:0 8px 8px 0;}
  .pbtn.warn{background:#7a2e39;}
  .pbtn.on{background:#7c5cff;box-shadow:inset 0 0 0 2px #b9a6ff;}
</style>
</head>
<body>

<!-- 1 ------------------------------------------------------------------ -->
<div class="screen" id="setup">
  <div class="hi">Who is playing?</div>
  <input id="nameinput" class="nameinput" type="text" autocomplete="off"
         autocapitalize="words" maxlength="16" placeholder="name">
  <button class="go" id="namego">OK</button>
  <div class="setuphint">Kept on this iPad only. Change it in parent settings.</div>
</div>

<div class="screen on" id="profile">
  <div class="hi" id="greet">Cześć!</div>
  <button class="avatar" id="pick-profile">🦄</button>
  <div class="pname" id="pname">—</div>
  <div class="build" id="build"></div>
</div>

<!-- 1b ----------------------------------------------------------------- -->
<div class="screen" id="welcome">
  <div class="wav pop" id="wav">🦄</div>
  <div class="wtitle" id="wtitle"></div>
</div>

<!-- 2 ------------------------------------------------------------------ -->
<div class="screen" id="lang">
  <div class="flags">
    <button class="flag" data-lang="pl">🇵🇱</button>
    <button class="flag" data-lang="nb">🇳🇴</button>
  </div>
</div>

<!-- 3 ------------------------------------------------------------------ -->
<div class="band" id="practiceband">TEST RUN — nothing is recorded</div>
<div class="screen" id="play">
  <div class="top">
    <div class="stars" id="stars"></div>
    <button class="navb" id="navback">←</button>
    <button class="trophy" id="trophy">🏆<span id="tcount">0</span></button>
  </div>
  <div class="stage">
    <div class="picwrap">
      <button class="pic" id="pic">🐘</button>
      <div class="hint" id="hint"></div>
    </div>
    <div class="word" id="word"></div>
    <div class="opts" id="opts"></div>
  </div>
</div>

<!-- 3b ----------------------------------------------------------------- -->
<button class="gear" id="gear">⚙</button>
<div class="confetti" id="confetti"></div>
<div class="bigprize" id="bigprize"><span id="bigprizeface">⭐️</span></div>
<div class="screen" id="board">
  <button class="backx" id="backx">←</button>
  <div class="btitle" id="btitle">Twoje nagrody</div>
  <div class="albumbar"><i id="albumfill"></i></div>
  <div class="grid" id="bgrid"></div>
  <div class="bhint" id="bhint">dotknij gdziekolwiek</div>
</div>

<!-- 4 ------------------------------------------------------------------ -->
<div class="screen" id="reward">
  <div class="big pop" id="prize">⭐️</div>
  <div class="rtitle" id="rtitle"></div>
  <div class="rsub" id="rsub">Masz nagrodę!</div>
  <div class="book" id="book"></div>
  <div class="rbtns">
    <button class="go" id="again">Jeszcze raz</button>
    <button class="go ghost" id="toboard">🏆</button>
    <button class="go ghost" id="swaplang">🇳🇴</button>
  </div>
</div>

<!-- 5 ------------------------------------------------------------------ -->
<div class="screen" id="stats">
  <h3>What she knows</h3>
  <div class="sbody" id="sbody"></div>
  <div class="srow">
    <button class="pbtn" id="copydata">Copy all data</button>
    <button class="pbtn" id="mergebtn">Merge another device</button>
    <button class="pbtn" id="importbtn">Replace with pasted</button>
    <button class="pbtn" id="sback">Back</button>
  </div>
  <textarea id="dump" class="dump"></textarea>
</div>

<div class="screen" id="parent">
  <h3>Parent settings</h3>
  <div class="prow">
    <button class="pbtn" id="statsbtn" style="width:100%;font-size:18px;padding:16px">
      What she knows →
    </button>
  </div>
  <div class="prow">
    <label>Speech speed — <b id="ratev">0.80</b>×</label>
    <input type="range" id="rate" min="0.3" max="1.0" step="0.05" value="0.7">
  </div>
  <div class="prow">
    <label>Questions in a round — <b id="goalv">20</b><br>
           <span style="opacity:.7">she gets one prize at the end of each round</span></label>
    <input type="range" id="goal" min="5" max="40" step="1" value="20">
  </div>
  <div class="prow">
    <label>Today: <b id="statv">0</b> correct · <b id="accv">—</b> first-try</label>
    <label>Launched: <b id="modev">—</b> · build <b id="buildv">—</b></label>
    <label>Saving: <b id="savev">—</b></label>
  </div>
  <div class="prow">
    <label>Sync key — paste the same one on every device she uses</label>
    <input id="synckey" class="nameinput synckeyin" type="text" autocomplete="off"
           autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="not set">
    <div style="margin-top:8px">
      <button class="pbtn" id="syncsave">Save key</button>
      <button class="pbtn" id="syncnow">Sync now</button>
    </div>
    <label style="margin-top:8px">Status: <b id="syncstat">—</b></label>
  </div>
  <div class="prow">
    <label>Test run — play without touching her stats, prizes or progress</label>
    <button class="pbtn" id="practicebtn">Test run: OFF</button>
  </div>
  <div class="prow">
    <label>What she practises</label>
    <button class="pbtn" data-mode="mixed">Mixed</button>
    <button class="pbtn" data-mode="letters">Letters</button>
    <button class="pbtn" data-mode="numbers">Numbers</button>
  </div>
  <div class="prow">
    <label>Language</label>
    <button class="pbtn" data-setlang="pl">🇵🇱 Polski</button>
    <button class="pbtn" data-setlang="nb">🇳🇴 Norsk</button>
  </div>
  <div>
    <button class="pbtn" id="pback">Back to the game</button>
    <button class="pbtn warn" id="preset">Reset today</button>
  </div>
</div>

<script>
(function () {
'use strict';

var BUILD = 44;
/* The sync service. The URL is public; the key the parent pastes in is the
   only credential, because there is no login for a four-year-old.        */
var SYNC_URL = 'https://litery-sync.pawlo999.workers.dev';   /* visible bottom-right and in the parent panel */

/* ============ content ============================================== */
/* Uppercase is what she SEES. The lowercase `w` is what the VOICE gets. */

var WORDS = {
  /* stage 1 rule: 3-4 letters, first letter missing. nothing longer. */
  pl: [
    {w:'ser', e:'🧀'}, {w:'sok', e:'🧃'}, {w:'sowa',e:'🦉'}, {w:'słoń',e:'🐘'}, {w:'sól', e:'🧂'},
    {w:'but', e:'👟'}, {w:'byk', e:'🐂'}, {w:'brat',e:'👦'},
    {w:'tort',e:'🎂'}, {w:'tata',e:'👨'}, {w:'tir', e:'🚛'},
    {w:'mama',e:'👩'}, {w:'miś', e:'🧸'}, {w:'mysz',e:'🐭'},

/* Earlier builds stored under a key that carried the child's name, and this
   file is published. Adopt any older litery.* key with the same suffix rather
   than naming it — renaming a key without migrating is how her prize
   collection was lost once already.                                        */
function readKey(k){
  try{
    var v = localStorage.getItem(k);
    if(v !== null) return v;
    var suffix = k.slice(k.lastIndexOf('.'));
    for(var i = 0; i < localStorage.length; i++){
      var other = localStorage.key(i);
      if(other && other !== k &&
         other.indexOf('litery.') === 0 &&
         other.slice(other.lastIndexOf('.')) === suffix){
        var val = localStorage.getItem(other);
        if(val !== null){ localStorage.setItem(k, val); return val; }
      }
    }
    return null;
  }catch(e){ return null; }
}

var LOG_CAP = 2000;   /* was deleted by an edit to the block above; its
                         absence threw inside saveLog and lost every row */
var LOG = [], MASTERY = {};

function loadLog(){
  try{ LOG = JSON.parse(readKey(LKEY) || '[]'); }catch(e){ LOG = []; }
  try{ MASTERY = JSON.parse(readKey(MKEY) || '{}'); }catch(e){ MASTERY = {}; }
}
function saveLog(){
  try{
    if(LOG.length > LOG_CAP) LOG = LOG.slice(-LOG_CAP);
    localStorage.setItem(LKEY, JSON.stringify(LOG));
    localStorage.setItem(MKEY, JSON.stringify(MASTERY));
    S.saveError = '';
  }catch(e){
    /* surfaced in the parent panel rather than swallowed — a silent catch
       here hid a ReferenceError that lost every logged row for an hour  */
    S.saveError = String(e && e.message || e);
    if(window.console) console.error('saveLog failed:', e);
  }
}

/* one row per question she finished. short keys because this is on disk.
   t=when l=language k=L|N s=stage x=target d=distractor o=options
   w=wrong taps ms=time to answer h=picture taps c=letter-tile taps        */
function record(target, distractor, wrongTaps, ms){
  if(S.practice) return;                 /* parent test runs never count */
  LOG.push({ t:Date.now(), l:S.lang, k:S.word.kind === 'number' ? 'N' : 'L',
             s:STAGE.id, x:String(target), d:String(distractor), o:STAGE.options,
             w:wrongTaps, ms:ms, h:S.hearPic, c:S.hearTile });

  /* Leitner-style box per item: first-try correct promotes, a miss resets.
     box 5 == she owns it. this is what stage advancement will read.       */
  var id = S.lang + ':' + (S.word.kind === 'number' ? 'N' : 'L') + ':' + target;
  var m = MASTERY[id] || { n:0, ft:0, box:1, streak:0, last:0, ms:[] };
  m.n++;
  if(wrongTaps === 0){ m.ft++; m.streak++; m.box = Math.min(5, m.box + 1); }
  else { m.streak = 0; m.box = 1; }
  m.last = Date.now();
  m.ms.push(ms); if(m.ms.length > 10) m.ms.shift();
  MASTERY[id] = m;
  saveLog();
}

/* push her progress to the laptop so it can be read without copy-paste.
   fire and forget: if the laptop is asleep or she is away from home WiFi
   this fails silently and the data stays on the iPad, which is the master. */
/* Post everything this device has, take back what the server merged. The
   server replays both histories, so neither device is authoritative and one
   opened after a long gap cannot erase the other.                        */
function cloudSync(){
  if(!S.syncKey || S.practice) return;
  S.syncMsg = 'syncing…';
  fetch(SYNC_URL + '/s/' + encodeURIComponent(S.syncKey), {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ prizes:S.prizes, log:LOG, mastery:MASTERY, name:S.name,
      settings:{ goal:S.goal, rate:S.rate, lang:S.lang, mode:S.mode } })
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    if(!d || !Array.isArray(d.log)) throw new Error((d && d.error) || 'bad reply');
    LOG = d.log;
    MASTERY = (d.mastery && Object.keys(d.mastery).length) ? d.mastery : rebuildMastery(LOG);
    if(Array.isArray(d.prizes)) S.prizes = d.prizes;
    saveLog(); save();
    S.syncMsg = LOG.length + ' rows in sync' + (d.added ? ' (+' + d.added + ')' : '');
  })
  .catch(function(e){ S.syncMsg = 'sync failed: ' + (e.message || e); });
}

function say(text, rate){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();

/* chime built from an oscillator so the app still ships zero audio files */
var AC = null;
function tone(freqs){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    freqs.forEach(function(f,i){
      var o = AC.createOscillator(), g = AC.createGain();
      o.type='sine'; o.frequency.value=f;
      var t = AC.currentTime + i*0.09;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.22,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.34);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+0.36);
    });
  }catch(e){}
}
function unlock(){
  if(unlocked) return; unlocked = true;
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); AC.resume(); }catch(e){}
  /* no silent priming utterance: say() cancels the queue, so the blank one
     was being killed mid-flight and the real greeting arrived late. the
     greeting itself runs inside the tap, which is all iOS requires.      */
}

/* ============ round ================================================= */
function mkey(kind, t){ return S.lang + ':' + (kind === 'number' ? 'N' : 'L') + ':' + t; }

function targetsFor(kind){
  if(kind === 'number'){
    var a = [];
    for(var i = 1; i <= STAGE.maxCount; i++) a.push(String(i));
    return a;
  }
  return POOL[S.lang];
}

/* Only the letters she has already met, plus a couple she has not. Thirteen
   letters arriving at once would drop her from 67% to near guessing in a
   single session; this lets the alphabet arrive two at a time instead.   */
function activePool(kind){
  var all = targetsFor(kind);
  if(kind === 'number') return all;
  var seen = [], unseen = [];
  all.forEach(function(t){
    (MASTERY[mkey(kind, t)] ? seen : unseen).push(t);
  });
  if(seen.length < 3) return all.slice(0, 3);
  return seen.concat(unseen.slice(0, STAGE.newAtOnce));
}

/* weight = 6 - box, so a letter she keeps missing (box 1) comes up five times
   as often as one she owns (box 5). this replaces picking a word at random,
   which made letter frequency a side effect of how many words start with it
   — Polish had five S-words against three B-words, so S was structurally
   favoured and she saw it twice as often as either letter she did not know. */
function pickWeighted(kind, pool){
  var now = Date.now();
  var total = 0, w = pool.map(function(t){
    var m = MASTERY[mkey(kind, t)];
    var weight = 6 - (m ? m.box : 1);
    /* days since she last saw it. a mastered letter drops to weight 1 for
       the rest of the day and climbs back as it goes stale, which is what
       keeps it alive without re-drilling what she just nailed.          */
    if(m && m.last){
      weight += Math.min(4, Math.floor((now - m.last) / 86400000));
    }
    total += weight;
    return weight;
  });
  var r = Math.random() * total;
  for(var i = 0; i < pool.length; i++){ r -= w[i]; if(r <= 0) return pool[i]; }
  return pool[pool.length - 1];
}

function chooseTarget(kind){
  var pool = activePool(kind);

  /* do not ask the same thing twice in a row if there is anything else */
  var fresh = pool.filter(function(t){ return S.recentT.indexOf(kind + t) < 0; });
  if(fresh.length >= 2) pool = fresh;

  /* the flat one-in-five retention draw was removed: with a growing pool it
     all landed on the single mastered letter and put it back on top. decay
     is handled by the staleness term in the weight instead.              */
  return pickWeighted(kind, pool);
}

function nextWord(){
  var kind = S.mode === 'letters' ? 'letter'
           : S.mode === 'numbers' ? 'number'
           : (S.correct % STAGE.numberEvery === STAGE.numberEvery - 1 ? 'number' : 'letter');

  var target = chooseTarget(kind);
  S.recentT.push(kind + target);
  if(S.recentT.length > 3) S.recentT.shift();

  if(kind === 'number'){
    return { kind:'number', n:+target,
             e:COUNT_EMOJI[(Math.random() * COUNT_EMOJI.length) | 0] };
  }

  /* the letter is decided first; the word is just a vehicle for it */
  var cands = WORDS[S.lang].filter(function(x){
    return x.w.charAt(0).toLowerCase() === target;
  });
  if(!cands.length) cands = WORDS[S.lang];
  var unseen = cands.filter(function(x){ return S.recent.indexOf(x.w) < 0; });
  if(unseen.length) cands = unseen;

  var pick = cands[(Math.random() * cands.length) | 0];
  S.recent.push(pick.w);
  if(S.recent.length > 4) S.recent.shift();
  return { kind:'letter', w:pick.w, e:pick.e };
}

/* what the picture says when tapped */
function sayQuestion(){
  if(S.word.kind === 'number') say(NUM[S.lang][S.word.n - 1]);
  else say(S.word.w);
}

/* one path for every letter sound: the letter INSIDE a word, so the link is
   explicit. never a bare letter - iOS reads that as "big S". spoken slower
   than a whole word, because this is the teaching moment.                 */
/* letters stay slower than whole words, but as a FRACTION of the slider,
   not a constant — 0.62 hard-coded meant the slider did nothing here.   */
function letterRate(){ return Math.max(0.3, S.rate * 0.8); }

function sayLetter(ch){
  var c = String(ch).toLowerCase();
  var ex = LETTER[S.lang] && LETTER[S.lang][c];
  if(ex) say(c + LINK[S.lang] + ex, letterRate());
  else if(S.word.kind === 'letter') say(S.word.w, letterRate());   /* ń, ó, y */
}

function sayWrong(val){
  if(S.word.kind === 'number') say(NUM[S.lang][(+val) - 1], letterRate());
  else setTimeout(function(){ sayLetter(val); }, 260);     /* let the shake land first */
}

function render(){
  var wd = $('word'), opts = $('opts'), pic = $('pic'), choices;
  wd.textContent = ''; opts.textContent = '';
  $('hint').textContent = UI[S.lang].tap;

  if(S.word.kind === 'number'){
    S.answer = String(S.word.n);
    /* the picture IS the quantity — counting, not a digit to copy */
    pic.textContent = '';
    pic.className = 'pic counting';
    var grid = document.createElement('div');
    var spots = DICE[S.word.n];
    grid.className = 'cnt' + (spots ? '' : ' wide');
    for(var k = 0; k < S.word.n; k++){
      var it = document.createElement('span');
      it.textContent = S.word.e;
      if(spots){
        it.style.gridRow = spots[k][0];
        it.style.gridColumn = spots[k][1];
      }
      grid.appendChild(it);
    }
    pic.appendChild(grid);

    var cell = document.createElement('span');
    cell.className = 'cell gap'; cell.id = 'gapbox';
    wd.appendChild(cell);

    var wrongN;
    do { wrongN = 1 + ((Math.random() * STAGE.maxCount) | 0); } while(wrongN === S.word.n);
    choices = [S.answer, String(wrongN)];

  } else {
    var word = S.word.w;
    S.answer = word.charAt(0).toLowerCase();
    pic.className = 'pic';
    pic.textContent = S.word.e;

    var shown = STAGE.upper ? word.toUpperCase() : word.toLowerCase();
    for(var i = 0; i < shown.length; i++){
      var c = document.createElement('span');
      c.className = 'cell';
      if(i === 0){ c.classList.add('gap'); c.id = 'gapbox'; }
      else {
        c.textContent = shown.charAt(i);
        c.classList.add('tappable');
        (function(ch){ c.addEventListener('click', function(){ unlock(); S.hearTile++; sayLetter(ch); }); })(shown.charAt(i));
      }
      wd.appendChild(c);
    }

    /* distract only with letters she has met, so a question never turns on
       a symbol she has never been shown */
    var known = activePool('letter').filter(function(l){ return l !== S.answer; });
    choices = [S.answer, known[(Math.random() * known.length) | 0]];
  }

  shuffle(choices).forEach(function(val){
    var b = document.createElement('button');
    b.className = 'opt';
    b.textContent = S.word.kind === 'number' ? val : disp(val);
    b.addEventListener('click', function(){ answer(val, b); });
    opts.appendChild(b);
  });

  S.locked = false;
  S.missed = false;
  S.wrongTaps = 0;
  S.qStart = Date.now();
  S.hearPic = 0;
  S.hearTile = 0;
  S.distractor = choices.filter(function(v){ return v !== S.answer; })[0] || '';
  drawStars();
  updateTrophy();
  $('practiceband').style.display = S.practice ? 'block' : 'none';
}

function answer(val, btn){
  if(S.locked) return;
  unlock();

  if(val !== S.answer){
    S.missed = true;
    S.wrongTaps = (S.wrongTaps || 0) + 1;
    btn.classList.add('shake');
    setTimeout(function(){ btn.classList.remove('shake'); btn.classList.add('dead'); }, 400);
    sayWrong(val);
    return;
  }

  S.locked = true;
  btn.classList.add('good');
  var g = $('gapbox');
  g.textContent = S.word.kind === 'number' ? val : disp(val);
  g.classList.add('in','pop');
  record(S.answer, S.distractor, S.wrongTaps || 0, Date.now() - S.qStart);
  if(!S.practice){
    S.correct++; S.asked++;
    if(!S.missed) S.firstTry++;
  }
  tone([660,880]);
  setTimeout(sayQuestion, 260);
  drawStars();
  updateTrophy();
  save();

  setTimeout(function(){
    if(S.correct >= S.goal) finish();
    else { S.word = nextWord(); render(); sayQuestion(); }
  }, 1650);
}

/* she collects each prize once per album; when an album is full a new one
   starts, so the board always has empty slots and never just repeats.     */
/* An album ends when it is FULL, not when a repeat turns up. Two devices
   awarding independently before they shared state produced four duplicates,
   and resetting on each of those made the album number and the count depend
   on where the repeats happened to fall — arithmetic nobody could follow.
   Legacy repeats are now skipped; the stored list stays a faithful record of
   what was actually awarded.                                              */
function albumOf(prizes){
  var out = [], seen = {};
  prizes.forEach(function(p){
    if(out.length >= PRIZES.length){ out = []; seen = {}; }   /* full: next one */
    if(seen[p]) return;                                       /* legacy repeat */
    seen[p] = 1; out.push(p);
  });
  return out;
}

function albumIndex(prizes){
  var n = 0, count = 0, seen = {};
  prizes.forEach(function(p){
    if(count >= PRIZES.length){ n++; count = 0; seen = {}; }
    if(seen[p]) return;
    seen[p] = 1; count++;
  });
  return n;
}

function awardPrize(){
  var inAlbum = albumOf(S.prizes);
  var pool = PRIZES.filter(function(p){ return inAlbum.indexOf(p) < 0; });
  if(!pool.length) pool = PRIZES;
  return pool[(Math.random()*pool.length)|0];
}

    rows.forEach(function(id){

      bar.appendChild(fill); row.appendChild(bar);
      row.appendChild(el('div','nums', m.n + ' seen · ' + pct + '% · ' +
                                       (median(m.ms)/1000).toFixed(1) + 's'));
      host.appendChild(row);
    });
  });

  /* ---- last 14 days ---- */
  var byDay = {};
  LOG.forEach(function(r){
    var d = dayKey(r.t);
    byDay[d] = byDay[d] || { q:0, ft:0, p:0 };
    if(r.k === 'P') byDay[d].p++;
    else { byDay[d].q++; if(!r.w) byDay[d].ft++; }

  var days = Object.keys(byDay).sort().reverse().slice(0,14);
  host.appendChild(el('div','shead','Last ' + days.length + ' day' + (days.length===1?'':'s')));
  if(!days.length){
    host.appendChild(el('div','empty','No days recorded yet.'));
  } else {
    var tab = el('table','dtab');

      tr.appendChild(el('td','r', v.q + ' q'));

      tr.appendChild(el('td','r', v.p + ' prize' + (v.p===1?'':'s')));
      tab.appendChild(tr);
    });

  }

  /* ---- progress toward the next stage: 80% of targets at box 4+,
          on two separate days (the rule you chose) ---- */
  host.appendChild(el('div','shead','Stage ' + STAGE.id + ' — clears at 80% on two days'));
  [['pl','Polish'],['nb','Norwegian']].forEach(function(L){
    var saveLang = S.lang; S.lang = L[0];
    var targets = activePool('letter');
    S.lang = saveLang;
    var ready = targets.filter(function(t){
      var m = MASTERY[L[0]+':L:'+t];
      if(!m || m.box < 4) return false;
      var ds = {};
      LOG.forEach(function(r){ if(r.l===L[0] && r.k==='L' && r.x===t && !r.w) ds[dayKey(r.t)]=1; });
      return Object.keys(ds).length >= 2;
    }).length;
    var pc = Math.round(100 * ready / targets.length);
    var row = el('div','item');
    row.appendChild(el('div','nums', L[1]));

    bar.appendChild(fill); row.appendChild(bar);
    row.appendChild(el('div','nums', ready + '/' + targets.length + ' · ' + pc + '%'));
    host.appendChild(row);
  });

  show('stats');
}

/* Mastery is derived, not authoritative: rebuilt from the log with exactly the
   rules record() applies. That makes two devices mergeable — you cannot
   meaningfully average two Leitner boxes, but you can replay both histories. */
function rebuildMastery(log){
  var M = {};
  log.slice()
     .filter(function(r){ return r.k === 'L' || r.k === 'N'; })
     .sort(function(a,b){ return a.t - b.t; })
     .forEach(function(r){
       var id = r.l + ':' + (r.k === 'N' ? 'N' : 'L') + ':' + r.x;
       var m = M[id] || { n:0, ft:0, box:1, streak:0, last:0, ms:[] };
       m.n++;
       if(!r.w){ m.ft++; m.streak++; m.box = Math.min(5, m.box + 1); }
       else { m.streak = 0; m.box = 1; }
       m.last = r.t;
       if(typeof r.ms === 'number'){ m.ms.push(r.ms); if(m.ms.length > 10) m.ms.shift(); }
       M[id] = m;
     });
  return M;
}

function rowKey(r){ return r.t + '|' + r.k + '|' + (r.x === undefined ? '' : r.x); }

/* Combine another device's history with this one instead of overwriting it.
   Prizes are rebuilt too: anything earned before prize logging existed is kept
   as a prefix, then every dated prize row across both devices in order.     */
function mergePayload(txt){
  var d = JSON.parse(txt);
  if(!d || typeof d !== 'object' || Array.isArray(d)) throw new Error('not a data payload');
  var incoming = Array.isArray(d.log) ? d.log : [];
  if(!incoming.length) throw new Error('that payload has no history to merge');

  var seen = {}, merged = [];
  LOG.concat(incoming).forEach(function(r){
    if(!r || typeof r.t !== 'number') return;
    var k = rowKey(r);
    if(seen[k]) return;
    seen[k] = 1; merged.push(r);
  });
  merged.sort(function(a,b){ return a.t - b.t; });

  var before = LOG.length, added = merged.length - before;

  /* prizes earned before any of it was logged, kept as a prefix */
  var localPrizeRows = LOG.filter(function(r){ return r.k === 'P'; }).length;
  var prefix = S.prizes.slice(0, Math.max(0, S.prizes.length - localPrizeRows));
  var dated  = merged.filter(function(r){ return r.k === 'P'; })
                     .map(function(r){ return r.x; });

  LOG = merged;
  S.prizes = prefix.concat(dated);
  MASTERY = rebuildMastery(LOG);
  S.restoredV = 2;
  save(); saveLog();

  return { added:added, total:LOG.length, prizes:S.prizes.length,
           mastery:Object.keys(MASTERY).length };
}

/* localStorage does not cross origins, so moving her from the laptop URL to
   the published one needs an explicit hand-off. also covers a new iPad.   */
function importPayload(txt){
  var d = JSON.parse(txt);
  if(!d || typeof d !== 'object' || Array.isArray(d)) throw new Error('not a data payload');
  if(!d.log && !d.mastery && !d.prizes) throw new Error('no progress in that payload');

  if(d.mastery && typeof d.mastery === 'object') MASTERY = d.mastery;
  if(Array.isArray(d.log))    LOG = d.log;
  if(Array.isArray(d.prizes)) S.prizes = d.prizes;
  if(d.settings){
    if(d.settings.goal) S.goal = d.settings.goal;
    if(d.settings.rate) S.rate = d.settings.rate;
    if(d.settings.lang) S.lang = d.settings.lang;
    if(d.settings.mode) S.mode = d.settings.mode;
  }
  if(d.name) S.name = d.name;
  S.restoredV = 2;
  save(); saveLog();
  return { prizes:S.prizes.length, log:LOG.length,
           mastery:Object.keys(MASTERY).length };
}

  $('goal').value = S.goal;
  $('statv').textContent = S.asked;
  $('accv').textContent  = S.asked ? Math.round(100*S.firstTry/S.asked)+'%' : '—';
  $('buildv').textContent = BUILD;
  $('savev').textContent = S.saveError ? ('FAILING — ' + S.saveError)
                                       : (LOG.length + ' rows recorded');
  $('synckey').value = S.syncKey || '';
  paintSync();
  paintPractice();
  paintChoices();
  $('swaplang').textContent = S.lang === 'pl' ? '🇳🇴' : '🇵🇱';
  $('modev').textContent = (window.navigator.standalone ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches))
      ? 'full screen, from the home icon' : 'inside Safari (address bar visible)';
  show('parent');
}
$('rate').addEventListener('input', function(e){
  S.rate = parseFloat(e.target.value);
  $('ratev').textContent = S.rate.toFixed(2); save();
});
$('goal').addEventListener('input', function(e){
  S.goal = parseInt(e.target.value,10);
  $('goalv').textContent = S.goal; save(); drawStars();
});
var dev = (location.search.match(/dev=([a-z]+)/) || [])[1];
var devMode = (location.search.match(/[?&]m=([a-z]+)/) || [])[1];
if(devMode) S.mode = devMode;
var devN = (location.search.match(/[?&]n=(\d+)/) || [])[1];
if(dev === 'probeui'){
  S.word = nextWord(); render(); show('play');
  var rect = function(id){
    var b = $(id).getBoundingClientRect();
    return id + '[' + Math.round(b.left) + '-' + Math.round(b.right) + (b.width ? '' : ' HIDDEN') + ']';
  };
  document.title = 'W' + window.innerWidth + ' ' + rect('stars') + ' ' + rect('navback') +
                   ' ' + rect('trophy') + ' ' + rect('gear') +
                   ' dots=' + document.querySelectorAll('#stars .st').length;
}
else if(dev === 'play'){ S.word = nextWord();
  if(devN && S.word.kind === 'number') S.word.n = +devN;
  render(); show('play'); }
else if(dev === 'welcome'){ $('wtitle').textContent = nm(SAY[S.lang].hi) + '!'; show('welcome'); }
else if(dev === 'probe'){ window.__probe = { chooseTarget:chooseTarget, nextWord:nextWord }; }
else if(dev === 'lang'){ show('lang'); }
else if(dev === 'parent'){ S.word = nextWord(); render(); openParent(); }
else if(dev === 'stats'){
  /* in-memory only, never saved — lets me look at a populated dashboard */
  var day = 86400000, now = Date.now();
  [['s',5,28,.93],['t',4,22,.82],['b',2,17,.53],['e',3,9,.67]].forEach(function(q){
    MASTERY['pl:L:'+q[0]] = { n:q[2], ft:Math.round(q[2]*q[3]), box:q[1], streak:2,
                              last:now, ms:[2100,2600,3100,2400,2900] };
  });
  [['3',5,14,.9],['7',2,8,.5]].forEach(function(q){
    MASTERY['pl:N:'+q[0]] = { n:q[2], ft:Math.round(q[2]*q[3]), box:q[1], streak:1,
                              last:now, ms:[1900,2200,2500] };
  });
  MASTERY['nb:L:s'] = { n:11, ft:8, box:4, streak:3, last:now, ms:[2800,3100,2600] };
  for(var d = 0; d < 6; d++){
    for(var i = 0; i < 12 + d; i++){
      LOG.push({ t:now - d*day, l:'pl', k:(i%3?'L':'N'), s:1,
                 x:'stbe'[i%4], d:'b', o:2, w:(i%3===0?1:0), ms:2000+i*80, h:i%2, c:0 });
    }
    LOG.push({ t:now - d*day, l:'pl', k:'P', x:'⭐️' });
  }
  LOG.push({ t:now - day, l:'pl', k:'L', s:1, x:'s', d:'b', o:2, w:0, ms:2200, h:0, c:0 });
  openStats();
}
else if(dev === 'board'){ S.prizes = ['⭐️','🚀','🦋','🍓','🐝','🌈','🎠']; S.word = nextWord(); render(); openBoard(); }
else if(dev === 'reward'){
  S.prizes = ['⭐️','🚀','🦋','🍓'];
  S.word = nextWord(); render();
  finish();                     /* the real path, so a crash here shows up */
}

$('navback').addEventListener('click', function(){ speechSynthesis.cancel(); show('lang'); });
$('trophy').addEventListener('click', openBoard);
$('toboard').addEventListener('click', openBoard);
$('book').addEventListener('click', openBoard);
/* two ways out: the arrow, and tapping anywhere */
$('backx').addEventListener('click', function(e){ e.stopPropagation(); leaveBoard(); });
$('bigprize').addEventListener('click', function(ev){
  ev.stopPropagation();
  $('bigprize').classList.remove('on');
});
$('board').addEventListener('click', function(){
  if($('bigprize').classList.contains('on')) return;   /* the overlay eats it */
  leaveBoard();
});

$('pback').addEventListener('click', leaveParent);
$('preset').addEventListener('click', function(){
  S.correct = 0; S.asked = 0; S.firstTry = 0; save(); drawStars(); leaveParent();
});

})();
</script>
</body>
</html>
